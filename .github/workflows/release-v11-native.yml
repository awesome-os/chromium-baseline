name: Release Holo v11 Native (linux-x86_64)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install libuv development headers & library
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev
      - name: Compile, test, and package linux-x86_64 dist-v11
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/release-v11-native.mts --mode build-and-package
      - name: Publish release v11-chromium-baseline-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/release-v11-native.mts --mode publish
